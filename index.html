<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Marry Me?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #ffe6ea, #ffb3c1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            position: relative;
            transition: background 1s ease;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 90%;
            width: 400px;
            z-index: 10;
        }

        h1 {
            color: #d90429;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            transition: all 0.5s ease;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: #2ecc71;
            color: white;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            z-index: 5;
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #e74c3c;
            color: white;
            position: absolute;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
            transition: all 0.1s ease;
            z-index: 5;
        }

        /* হার্ট অ্যানিমেশনের স্টাইল */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 24px;
            position: fixed;
            top: -10%;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="question">Will you marry me? 💍</h1>
        <div class="btn-group">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');

        // 'No' বাটন দূরে সরিয়ে দেওয়ার ফাংশন
        function moveNoButton() {
            const padding = 60;
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding * 2) + padding;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding * 2) + padding;

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // স্ক্রিনে হার্ট তৈরি করার ফাংশন
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            // বিভিন্ন ধরণের হার্ট ইমোজি র্যান্ডমলি আসবে
            const heartIcons = ['❤️', '💖', '💘', '💝', '💕'];
            heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            
            // র্যান্ডম সাইজ এবং পজিশন
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 2 + 3 + "s"; // ৩ থেকে ৫ সেকেন্ডের মধ্যে পড়বে
            heart.style.fontSize = Math.random() * 20 + 20 + "px"; // ২০px থেকে ৪০px সাইজ
            
            document.body.appendChild(heart);

            // অ্যানিমেশন শেষ হলে হার্টটি রিমুভ হয়ে যাবে যেন ব্রাউজার স্লো না হয়
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // 'Yes' বাটনে ক্লিক করলে যা হবে
        function celebrate() {
            question.innerHTML = "I knew it! ❤️ 🎉<br><span style='font-size: 1.5rem; color: #fff;'>Love You Forever!</span>";
            question.style.color = "#fff";
            
            noBtn.style.display = 'none'; 
            yesBtn.style.display = 'none';
            
            document.body.style.background = '#ff4d6d'; // ব্যাকগ্রাউন্ড গাঢ় লাল হবে
            
            // অনবরত হার্ট পড়তে থাকবে
            setInterval(createHeart, 150);
        }
    </script>

</body>
</html>
