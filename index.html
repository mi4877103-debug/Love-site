<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Queen 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }
        /* Page 1 Styles */
        .page {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: all 0.8s ease-in-out;
            position: absolute;
        }
        #page2 {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
            background: linear-gradient(135deg, #2b001d, #4a002c);
            color: white;
        }
        h1 {
            font-size: 2.5rem;
            color: #ff477e;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        #page2 h1 {
            color: #ff85a2;
        }
        p {
            font-size: 1.2rem;
            color: #6c757d;
            margin-bottom: 40px;
        }
        #page2 p {
            color: #f7cad0;
        }
        .btn-heart {
            background-color: #ff477e;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 71, 126, 0.4);
            transition: transform 0.3s, background-color 0.3s;
            animation: pulse 1.5s infinite;
        }
        .btn-heart:hover {
            transform: scale(1.1);
            background-color: #ff0a54;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        /* Page 2 - Animation Styles */
        .animation-container {
            position: relative;
            width: 300px;
            height: 200px;
            margin-bottom: 30px;
        }
        .hand {
            font-size: 5rem;
            position: absolute;
            transition: all 1.5s ease-in-out;
        }
        .girl-hand {
            left: 20px;
            top: 50px;
            transform: scaleX(-1); /* Flips the hand to face right */
        }
        .boy-hand {
            right: 20px;
            top: 50px;
            opacity: 0;
            transform: translateX(100px);
        }
        .ring {
            font-size: 2rem;
            position: absolute;
            right: 95px;
            top: 85px;
            opacity: 0;
            transition: all 1.5s ease-in-out;
            transform: scale(0.5);
        }
        /* Active Animation Triggered by JS */
        .start-anim .boy-hand {
            opacity: 1;
            transform: translateX(0);
        }
        .start-anim .ring {
            opacity: 1;
            transform: translate(-95px, 0px) scale(1); /* Moves ring onto girl's finger */
            transition-delay: 0.5s;
        }
        /* Floating Hearts Background */
        .hearts-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            top: 0;
            left: 0;
        }
        .floating-heart {
            position: absolute;
            color: rgba(255, 71, 126, 0.6);
            animation: floatUp 4s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- FIRST PAGE -->
    <div id="page1" class="page">
        <h1>Hey Beautiful.. ❤️</h1>
        <p>তোমার জন্য ছোট্ট একটা সারপ্রাইজ আছে। দেখতে চাইলে নিচের বাটনে চাপ দাও!</p>
        <button class="btn-heart" onclick="nextPage()">এখানে চাপ দাও 💖</button>
    </div>

    <!-- SECOND PAGE -->
    <div id="page2" class="page">
        <h1>Will You Be Mine Forever? 💍</h1>
        
        <div class="animation-container" id="animContainer">
            <!-- Girl's Hand -->
            <div class="hand girl-hand">🫱</div>
            <!-- Boy's Hand holding ring conceptually -->
            <div class="hand boy-hand">🫲</div>
            <!-- The Ring that will slide into finger -->
            <div class="ring">💍</div>
        </div>

        <p>আজীবন তোমার হাতটা এভাবেই ধরে রাখতে চাই!</p>
    </div>

    <div class="hearts-bg" id="heartsBg"></div>

    <script>
        function nextPage() {
            // Hide page 1, show page 2
            document.getElementById('page1').style.opacity = '0';
            document.getElementById('page1').style.pointerEvents = 'none';
            
            const page2 = document.getElementById('page2');
            page2.style.opacity = '1';
            page2.style.pointerEvents = 'auto';
            page2.style.transform = 'scale(1)';

            // Start the hand and ring animation after a short delay
            setTimeout(() => {
                document.getElementById('animContainer').classList.add('start-anim');
                startHearts();
            }, 300);
        }

        // Background heart floating effect
        function startHearts() {
            const bg = document.getElementById('heartsBg');
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.classList.add('floating-heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                bg.appendChild(heart);

                // Remove heart after animation ends
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 300);
        }
    </script>
</body>
</html>
