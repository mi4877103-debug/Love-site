<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>My Special World</title>
  <style>
    body {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      font-family: 'Arial', sans-serif;
      text-align: center;
      color: white;
      margin: 0;
      padding: 0;
    }
    h1 {
      margin-top: 100px;
      font-size: 60px;
      animation: glow 2s infinite alternate;
    }
    p {
      font-size: 22px;
      margin-top: 20px;
    }
    button {
      margin-top: 40px;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #fff;
      color: #2575fc;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #2575fc;
      color: #fff;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #fff; }
      to { text-shadow: 0 0 20px #ff0; }
    }
  </style>
</head>
<body>
  <h1>🌍 My Special World 🌍</h1>
  <p>এখানে শুরু হলো আমার নতুন ওয়েবসাইট!</p>
  <button onclick="alert('তুমি আমার ওয়েবসাইটে ঢুকেছো 💫')">Explore</button>
</body>
</html>
