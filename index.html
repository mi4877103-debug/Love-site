<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রক্ত সঞ্চালন অ্যানিমেশন</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d11;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .system-container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* হৃদপিণ্ড পাম্পিং অ্যানিমেশন */
        .heart {
            position: relative;
            width: 80px;
            height: 80px;
            background-color: #ff2e63;
            transform: rotate(-45deg);
            animation: heartbeat 1.2s infinite ease-in-out;
            box-shadow: 0 0 30px #ff2e63;
            z-index: 10;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            background-color: #ff2e63;
            border-radius: 50%;
        }

        .heart::before { top: -40px; left: 0; }
        .heart::after { top: 0; left: 40px; }

        /* রক্ত চলাচলের পথ (শিরা ও ধমনী) */
        .vessel {
            position: absolute;
            border: 4px dashed;
            border-radius: 50%;
            animation: circulate 6s linear infinite;
        }

        /* ধমনী (অক্সিজেনযুক্ত রক্ত - লাল) */
        .artery {
            width: 250px;
            height: 250px;
            border-color: #ff4d4d;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.3);
        }

        /* শিরা (কার্বন ডাই অক্সাইডযুক্ত রক্ত - নীল) */
        .vein {
            width: 320px;
            height: 320px;
            border-color: #00adb5;
            box-shadow: 0 0 10px rgba(0, 173, 181, 0.3);
            animation-direction: reverse; /* উল্টো দিকে রক্ত প্রবাহের জন্য */
        }

        /* হৃদপিণ্ডের পাম্পিং অ্যানিমেশন */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1) rotate(-45deg); }
            25% { transform: scale(1.15) rotate(-45deg); }
            40% { transform: scale(1.05) rotate(-45deg); }
            65% { transform: scale(1.2) rotate(-45deg); }
        }

        /* রক্ত সঞ্চালনের ঘূর্ণন অ্যানিমেশন */
        @keyframes circulate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="system-container">
        <!-- লাল ধমনী (Artery) -->
        <div class="vessel artery"></div>
        
        <!-- নীল শিরা (Vein) -->
        <div class="vessel vein"></div>
        
        <!-- মূল হৃদপিণ্ড -->
        <div class="heart"></div>
    </div>

</body>
</html>
